<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6b1f2e" />
  <title>Boutique — HADShop</title>
  <meta name="description" content="Tout le catalogue HADShop : sacs, parfums, vêtements, bijoux et montres." />

  <!-- ✅ ÉTAPE 1 : Lecture du thème AVANT tout -->
  <script>
    window.HADSHOP_THEMES = {
      bordeaux: { primary: "#6b2a24", "primary-foreground": "#fcf6f5", secondary: "#f2dfd9", "muted-foreground": "#8a6a68", blush: "#f6e6e3", gold: "#c49a4a", background: "#fdfcfb", foreground: "#3b1c1a", border: "#ebd8d4" },
      noirOr: { primary: "#1a1a1a", "primary-foreground": "#d4af37", secondary: "#f0e6d2", "muted-foreground": "#6a6a6a", blush: "#f5efe0", gold: "#d4af37", background: "#faf6ec", foreground: "#1a1a1a", border: "#d4cbb5" },
      pastel: { primary: "#8b6b7d", "primary-foreground": "#fefefe", secondary: "#f5e6ee", "muted-foreground": "#a893a0", blush: "#fdf0f5", gold: "#d4a5c0", background: "#fffafc", foreground: "#4a3540", border: "#ead5de" },
      emeraude: { primary: "#1e4d3a", "primary-foreground": "#f0f9f4", secondary: "#d8e8df", "muted-foreground": "#4a6a5a", blush: "#e0f0e6", gold: "#b8933f", background: "#f8fbf9", foreground: "#1a3a2a", border: "#c8dcd0" }
    };

    let HADSHOP_THEME = "bordeaux";
    try {
      const raw = localStorage.getItem("hadshop_settings");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.theme && window.HADSHOP_THEMES[parsed.theme]) {
          HADSHOP_THEME = parsed.theme;
        }
      }
    } catch (e) {}
    
    window.HADSHOP_ACTIVE_COLORS = window.HADSHOP_THEMES[HADSHOP_THEME];
    console.log("[HADShop Boutique] Thème actif :", HADSHOP_THEME);
  </script>

  <!-- ✅ SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: window.HADSHOP_ACTIVE_COLORS,
          fontFamily: { sans: ["Jost", "sans-serif"], display: ["Cormorant Garamond", "serif"] }
        }
      }
    }
  </script>

  <style id="theme-fallback">
    body { background: var(--theme-bg); color: var(--theme-fg); }
  </style>
  <script>
    (function() {
      const c = window.HADSHOP_ACTIVE_COLORS;
      document.documentElement.style.setProperty('--theme-bg', c.background);
      document.documentElement.style.setProperty('--theme-fg', c.foreground);
    })();
  </script>
</head>
<body class="bg-background text-foreground font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 border-b border-border bg-background/90 backdrop-blur">
    <div class="mx-auto grid h-16 max-w-6xl grid-cols-[1fr_auto_1fr] items-center px-4">
      <div class="flex items-center gap-6">
        <button aria-label="Menu" class="md:hidden" onclick="document.getElementById('mobile-menu').classList.remove('hidden')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <nav class="hidden gap-6 md:flex">
          <a href="index.html" class="eyebrow hover:text-primary transition-colors">Accueil</a>
          <a href="boutique.html" class="eyebrow hover:text-primary transition-colors text-primary">Boutique</a>
          <a href="a-propos.html" class="eyebrow hover:text-primary transition-colors">À propos</a>
        </nav>
      </div>
      <a href="index.html" id="header-logo" class="font-display text-2xl tracking-[0.18em] text-primary" style="visibility: hidden;">HADSHOP</a>
      <div class="flex justify-end">
        <a href="panier.html" aria-label="Panier" class="relative p-1 hover:text-primary transition-colors">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span id="cart-badge" class="absolute -right-1 -top-1 grid h-4 min-w-4 place-items-center rounded-full bg-primary px-1 text-[10px] text-primary-foreground" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <div id="mobile-menu" class="hidden fixed inset-0 z-50 bg-background">
    <div class="flex h-16 items-center justify-between px-4">
      <span id="mobile-logo" class="font-display text-2xl tracking-[0.18em] text-primary" style="visibility: hidden;">HADSHOP</span>
      <button onclick="document.getElementById('mobile-menu').classList.add('hidden')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="flex flex-col gap-8 px-8 pt-12">
      <a href="index.html" class="font-display text-4xl text-primary">Accueil</a>
      <a href="boutique.html" class="font-display text-4xl text-primary">Boutique</a>
      <a href="a-propos.html" class="font-display text-4xl text-primary">À propos</a>
      <a href="panier.html" class="font-display text-4xl text-primary">Panier</a>
    </nav>
  </div>

  <main class="flex-grow mx-auto max-w-6xl px-4 pt-10 w-full">
    <h1 class="text-center text-5xl text-primary font-display">La Boutique</h1>
    
    <div class="relative mx-auto mt-6 max-w-md">
      <svg class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="search-input" type="text" placeholder="Rechercher par nom ou description" class="w-full border-b border-border bg-transparent py-3 pl-10 pr-3 text-base outline-none focus:border-primary transition-colors" />
    </div>

    <div class="mt-6 mx-auto max-w-2xl">
      <div class="flex flex-wrap gap-3 items-center justify-center">
        <div class="flex items-center gap-2">
          <label class="text-xs uppercase text-muted-foreground">Prix min</label>
          <input id="price-min" type="number" placeholder="0" class="w-24 border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary" />
        </div>
        
        <div class="flex items-center gap-2">
          <label class="text-xs uppercase text-muted-foreground">Prix max</label>
          <input id="price-max" type="number" placeholder="∞" class="w-24 border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary" />
        </div>

        <label class="flex items-center gap-2 cursor-pointer">
          <input id="filter-promo" type="checkbox" class="w-4 h-4" />
          <span class="text-xs uppercase text-muted-foreground">En promo</span>
        </label>

        <div class="flex items-center gap-2">
          <label class="text-xs uppercase text-muted-foreground">Trier</label>
          <select id="sort-select" class="border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary">
            <option value="recent">Nouveautés</option>
            <option value="price-asc">Prix croissant</option>
            <option value="price-desc">Prix décroissant</option>
            <option value="name-asc">Nom (A→Z)</option>
          </select>
        </div>

        <button id="reset-filters" class="text-xs uppercase text-red-500 hover:underline">Réinitialiser</button>
      </div>
    </div>

    <div id="filters-container" class="-mx-4 mt-6 flex gap-2 overflow-x-auto px-4 pb-2 md:justify-center no-scrollbar"></div>
    
    <div id="grid-container" class="mt-8 grid grid-cols-2 gap-x-3 gap-y-8 md:grid-cols-4 md:gap-x-6"></div>
    <p id="empty-message" class="py-20 text-center text-muted-foreground hidden">Aucun article ne correspond à votre recherche.</p>
  </main>

  <footer class="mt-12 bg-primary text-primary-foreground relative">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 px-6 py-6 text-center md:flex-row md:text-left">
      <div class="flex flex-col md:flex-row md:items-center gap-1 md:gap-4">
        <p id="footer-logo" class="font-display text-xl tracking-[0.18em]" style="visibility: hidden;">HADSHOP</p>
        <span class="hidden md:inline text-[10px] opacity-60">|</span>
        <p id="footer-slogan" class="text-[10px] opacity-80" style="visibility: hidden;">Mode, sacs, parfums & accessoires.</p>
      </div>

      <a id="footer-wa-link" href="#" target="_blank" rel="noreferrer" class="eyebrow inline-flex items-center gap-1.5 border-b border-primary-foreground/30 pb-0.5 hover:opacity-80 transition-opacity text-[0.65rem]">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg> Nous écrire sur WhatsApp
      </a>

      <p id="secret-trigger" class="text-[10px] opacity-60 cursor-pointer select-none active:opacity-100 transition-opacity">
        © 2026 HADShop
      </p>
    </div>
    
    <div id="admin-toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#222] text-white px-6 py-3 rounded-full text-sm shadow-xl transition-all duration-300 opacity-0 translate-y-4 z-50 pointer-events-none flex items-center gap-2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-green-400"><path d="M20 6 9 17l-5-5"/></svg>
      Mode Administrateur activé...
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      
      const DEFAULT_PRODUCTS = [
        { id: "sac-lady-gris", name: "Sac Lady Gris", category: "Sacs", price: 120000, promoPrice: null, images: ["https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&q=80"], image: null, stock: 10 },
        { id: "parfum-eclat", name: "Parfum Éclat", category: "Parfums", price: 85000, promoPrice: 65000, images: ["https://images.unsplash.com/photo-1541643600914-78b084683601?w=600&q=80"], image: null, stock: 15 },
        { id: "mini-sac-nude", name: "Mini Sac Nude", category: "Sacs", price: 95000, promoPrice: null, images: ["https://images.unsplash.com/photo-1591561954557-26941169b49e?w=600&q=80"], image: null, stock: 8 },
        { id: "parfum-noir", name: "Parfum Noir", category: "Parfums", price: 110000, promoPrice: null, images: ["https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=600&q=80"], image: null, stock: 5 },
        { id: "montre-acier", name: "Montre Acier", category: "Montres", price: 75000, promoPrice: null, images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80"], image: null, stock: 3 },
        { id: "bracelet-dore", name: "Bracelet Doré", category: "Bijoux", price: 25000, promoPrice: null, images: ["https://images.unsplash.com/photo-1608042314453-ae338d80c427?w=600&q=80"], image: null, stock: 20 },
        { id: "escarpins-nude", name: "Escarpins Nude", category: "Chaussures", price: 65000, promoPrice: null, images: ["https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=600&q=80"], image: null, stock: 12 },
        { id: "gourde-isotherme", name: "Gourde Isotherme", category: "Gourdes & thermos", price: 15000, promoPrice: null, images: ["https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=600&q=80"], image: null, stock: 50 }
      ];

      const DEFAULT_CATEGORIES = ["Sacs", "Parfums", "Vêtements", "Chaussures", "Bijoux", "Montres", "Gourdes & thermos"];

      // ✅ Chargement depuis Supabase
      let settings = null;
      let products = [];
      
      try {
        const { data: settingsData } = await window.supabaseClient
          .from("settings")
          .select("*")
          .eq("id", 1)
          .single();
        if (settingsData) settings = settingsData;
      } catch (e) {
        console.warn("Erreur chargement paramètres :", e);
      }
      
      try {
        const { data: productsData } = await window.supabaseClient
          .from("products")
          .select("*")
          .order("createdAt", { ascending: false });
        if (productsData) products = productsData;
      } catch (e) {
        console.warn("Erreur chargement produits :", e);
      }

      const PRODUCTS = (products && products.length > 0) ? products : DEFAULT_PRODUCTS;
      const CATEGORIES = (settings && settings.categories) ? settings.categories : DEFAULT_CATEGORIES;
      const WHATSAPP_NUMBER = (settings && settings.whatsapp) ? settings.whatsapp : "2290191647720";
      
      const SHOP_NAME = (settings && settings.shopName) ? settings.shopName : "HADSHOP";
      const HERO_TEXT = (settings && settings.heroText) ? settings.heroText : "Mode, sacs, parfums & accessoires.";

      const formatPrice = (n) => new Intl.NumberFormat("fr-FR").format(n).replace(/\u202f|\u00a0/g, " ") + " FCFA";

      const getCart = () => { try { return JSON.parse(localStorage.getItem("hadshop-cart")) || []; } catch { return []; } };
      const updateBadge = () => {
        const count = getCart().reduce((s, l) => s + l.qty, 0);
        const badge = document.getElementById("cart-badge");
        if (badge) { badge.textContent = count; badge.hidden = count === 0; }
      };

      document.getElementById("header-logo").textContent = SHOP_NAME;
      document.getElementById("mobile-logo").textContent = SHOP_NAME;
      document.getElementById("footer-logo").textContent = SHOP_NAME;
      document.getElementById("footer-slogan").textContent = HERO_TEXT;
      document.getElementById("footer-wa-link").href = `https://wa.me/${WHATSAPP_NUMBER}`;
      
      document.getElementById("header-logo").style.visibility = "visible";
      document.getElementById("mobile-logo").style.visibility = "visible";
      document.getElementById("footer-logo").style.visibility = "visible";
      document.getElementById("footer-slogan").style.visibility = "visible";
      
      updateBadge();

      const params = new URLSearchParams(window.location.search);
      const currentCat = params.get("categorie") || "";
      let searchQuery = "";
      
      let priceMin = 0;
      let priceMax = Infinity;
      let onlyPromo = false;
      let sortBy = "recent";

      const filtersContainer = document.getElementById("filters-container");
      const gridContainer = document.getElementById("grid-container");
      const emptyMessage = document.getElementById("empty-message");
      const searchInput = document.getElementById("search-input");

      const priceMinInput = document.getElementById("price-min");
      const priceMaxInput = document.getElementById("price-max");
      const promoCheckbox = document.getElementById("filter-promo");
      const sortSelect = document.getElementById("sort-select");
      const resetBtn = document.getElementById("reset-filters");

      function renderFilters() {
        let html = `<a href="boutique.html" class="eyebrow shrink-0 rounded-full border px-4 py-2.5 transition-colors ${currentCat === "" ? "border-primary bg-primary text-primary-foreground" : "border-border hover:border-primary hover:text-primary"}">Tout</a>`;
        CATEGORIES.forEach(c => {
          const isActive = (currentCat === c);
          html += `<a href="boutique.html?categorie=${encodeURIComponent(c)}" class="eyebrow shrink-0 rounded-full border px-4 py-2.5 transition-colors ${isActive ? "border-primary bg-primary text-primary-foreground" : "border-border hover:border-primary hover:text-primary"}">${c}</a>`;
        });
        filtersContainer.innerHTML = html;
      }

      function renderGrid() {
        let filteredProducts = PRODUCTS.filter(p => {
          const matchCat = (currentCat === "") || (p.category === currentCat);
          
          const searchLower = searchQuery.toLowerCase().trim();
          const matchSearch = !searchLower || 
            p.name.toLowerCase().includes(searchLower) || 
            (p.description || "").toLowerCase().includes(searchLower);
          
          const inStock = (p.stock === undefined) || (Number(p.stock) > 0);
          
          const price = p.promoPrice || p.price;
          const matchPrice = price >= priceMin && price <= priceMax;
          
          const matchPromo = !onlyPromo || (p.promoPrice !== null && p.promoPrice !== undefined);
          
          return matchCat && matchSearch && inStock && matchPrice && matchPromo;
        });

        if (sortBy === "price-asc") {
          filteredProducts.sort((a, b) => (a.promoPrice || a.price) - (b.promoPrice || b.price));
        } else if (sortBy === "price-desc") {
          filteredProducts.sort((a, b) => (b.promoPrice || b.price) - (a.promoPrice || a.price));
        } else if (sortBy === "name-asc") {
          filteredProducts.sort((a, b) => a.name.localeCompare(b.name, "fr"));
        } else {
          if (filteredProducts[0] && filteredProducts[0].createdAt) {
            filteredProducts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          }
        }

        if (filteredProducts.length === 0) {
          gridContainer.innerHTML = "";
          emptyMessage.classList.remove("hidden");
          return;
        }

        emptyMessage.classList.add("hidden");
        const now = new Date();

        gridContainer.innerHTML = filteredProducts.map(p => {
          const imgSrc = p.image || (p.images && p.images[0]) || "";
          let isNew = false;
          if (p.createdAt) {
            const createdDate = new Date(p.createdAt);
            const diffDays = (now - createdDate) / (1000 * 60 * 60 * 24);
            if (diffDays <= 7) isNew = true;
          }

          const finalPrice = p.promoPrice || p.price;
          const percent = p.promoPrice ? Math.round(((p.price - p.promoPrice) / p.price) * 100) : 0;
          
          const showStock = p.stock !== undefined && p.stock > 0 && p.stock <= 5;
          const stockLabel = showStock ? `<span class="absolute bottom-2 right-2 bg-white/90 text-[10px] font-medium px-2 py-1 rounded text-red-600 shadow-sm z-10">Plus que ${p.stock} en stock</span>` : "";

          return `
            <a href="produit.html?id=${p.id}" class="group block relative">
              <div class="relative aspect-[4/5] overflow-hidden bg-blush">
                ${imgSrc ? `<img src="${imgSrc}" alt="${p.name}" loading="lazy" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105" />` : `<div class="h-full w-full flex items-center justify-center text-xs text-muted-foreground">Sans image</div>`}
                ${isNew ? `<span class="eyebrow absolute left-2 top-2 bg-background/90 px-2 py-1 text-[0.6rem] text-primary">Nouveau</span>` : ""}
                ${p.promoPrice ? `<span class="absolute right-2 top-2 bg-red-600 text-white text-[10px] font-bold px-1.5 py-1 rounded-full shadow-sm z-10">-${percent}%</span>` : ""}
                ${stockLabel}
              </div>
              <div class="pt-3">
                <h3 class="font-display text-lg leading-tight text-primary">${p.name}</h3>
                <div class="mt-1 flex items-center gap-2">
                  <p class="text-sm text-primary font-medium">${formatPrice(finalPrice)}</p>
                  ${p.promoPrice ? `<p class="text-xs text-muted-foreground line-through">${formatPrice(p.price)}</p>` : ""}
                </div>
              </div>
            </a>
          `;
        }).join("");
      }

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderGrid();
      });

      priceMinInput.addEventListener("input", (e) => {
        priceMin = Number(e.target.value) || 0;
        renderGrid();
      });

      priceMaxInput.addEventListener("input", (e) => {
        priceMax = e.target.value ? Number(e.target.value) : Infinity;
        renderGrid();
      });

      promoCheckbox.addEventListener("change", (e) => {
        onlyPromo = e.target.checked;
        renderGrid();
      });

      sortSelect.addEventListener("change", (e) => {
        sortBy = e.target.value;
        renderGrid();
      });

      resetBtn.addEventListener("click", () => {
        priceMin = 0;
        priceMax = Infinity;
        onlyPromo = false;
        sortBy = "recent";
        searchQuery = "";
        priceMinInput.value = "";
        priceMaxInput.value = "";
        promoCheckbox.checked = false;
        sortSelect.value = "recent";
        searchInput.value = "";
        renderGrid();
      });

      renderFilters();
      renderGrid();

      const trigger = document.getElementById("secret-trigger");
      const toast = document.getElementById("admin-toast");
      let clickCount = 0;
      let clickTimeout = null;

      trigger.addEventListener("click", () => {
        clickCount++;
        if (clickTimeout) clearTimeout(clickTimeout);

        if (clickCount === 3) {
          toast.classList.remove("opacity-0", "translate-y-4");
          toast.classList.add("opacity-100", "translate-y-0");
          clickTimeout = setTimeout(() => {
            window.location.href = "admin-login.html";
          }, 1500);
          clickCount = 0;
        } else {
          clickTimeout = setTimeout(() => { clickCount = 0; }, 1000);
        }
      });
    });
  </script>
</body>
</html>
