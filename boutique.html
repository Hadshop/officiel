<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6b1f2e" />
  <title>Boutique — HADShop</title>
  <meta name="description" content="Tout le catalogue HADShop : sacs, parfums, vêtements, bijoux et montres." />

  <!-- ✅ ÉTAPE 1 : Thème + cache settings + cache produits AVANT TOUT -->
  <script>
    window.HADSHOP_THEMES = {
      bordeaux: { primary: "#6b2a24", "primary-foreground": "#fcf6f5", secondary: "#f2dfd9", "muted-foreground": "#8a6a68", blush: "#f6e6e3", gold: "#c49a4a", background: "#fdfcfb", foreground: "#3b1c1a", border: "#ebd8d4" },
      noirOr: { primary: "#1a1a1a", "primary-foreground": "#d4af37", secondary: "#f0e6d2", "muted-foreground": "#6a6a6a", blush: "#f5efe0", gold: "#d4af37", background: "#faf6ec", foreground: "#1a1a1a", border: "#d4cbb5" },
      pastel: { primary: "#8b6b7d", "primary-foreground": "#fefefe", secondary: "#f5e6ee", "muted-foreground": "#a893a0", blush: "#fdf0f5", gold: "#d4a5c0", background: "#fffafc", foreground: "#4a3540", border: "#ead5de" },
      emeraude: { primary: "#1e4d3a", "primary-foreground": "#f0f9f4", secondary: "#d8e8df", "muted-foreground": "#4a6a5a", blush: "#e0f0e6", gold: "#b8933f", background: "#f8fbf9", foreground: "#1a3a2a", border: "#c8dcd0" }
    };

    window.HADSHOP_CACHED_SETTINGS = null;
    window.HADSHOP_CACHED_PRODUCTS = null;

    try {
      const raw = localStorage.getItem("hadshop_settings");
      if (raw) window.HADSHOP_CACHED_SETTINGS = JSON.parse(raw);
    } catch (e) {}
    try {
      const raw = localStorage.getItem("hadshop_products_cache");
      if (raw) window.HADSHOP_CACHED_PRODUCTS = JSON.parse(raw);
    } catch (e) {}

    let HADSHOP_THEME = "bordeaux";
    if (window.HADSHOP_CACHED_SETTINGS && window.HADSHOP_CACHED_SETTINGS.theme && window.HADSHOP_THEMES[window.HADSHOP_CACHED_SETTINGS.theme]) {
      HADSHOP_THEME = window.HADSHOP_CACHED_SETTINGS.theme;
    }
    window.HADSHOP_ACTIVE_COLORS = window.HADSHOP_THEMES[HADSHOP_THEME];

    window.HADSHOP_DEFAULTS = {
      SHOP_NAME: "HADSHOP",
      HERO_TEXT: "Mode, sacs, parfums & accessoires.",
      WHATSAPP: "2290191647720",
      CATEGORIES: ["Sacs", "Parfums", "Vêtements", "Chaussures", "Bijoux", "Montres", "Gourdes & thermos"]
    };
  </script>

  <!-- ✅ SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: window.HADSHOP_ACTIVE_COLORS,
          fontFamily: { sans: ["Jost", "sans-serif"], display: ["Cormorant Garamond", "serif"] }
        }
      }
    }
  </script>

  <style id="theme-fallback">
    body {
      background-color: var(--theme-bg, #fdfcfb);
      background-image:
        linear-gradient(135deg, rgba(246, 230, 227, 0.45) 0%, transparent 45%, rgba(196, 154, 74, 0.05) 100%),
        radial-gradient(circle at 1px 1px, rgba(107, 42, 36, 0.05) 1px, transparent 0);
      background-size: 100% 100%, 24px 24px;
      background-attachment: fixed;
      color: var(--theme-fg);
    }
    [data-hydrate] { visibility: hidden; }
    
    /* ✅ Empêche le repaint visible lors du swap */
    #grid-container { transition: opacity 0.15s ease; }
  </style>
  <script>
    (function() {
      const c = window.HADSHOP_ACTIVE_COLORS;
      document.documentElement.style.setProperty('--theme-bg', c.background);
      document.documentElement.style.setProperty('--theme-fg', c.foreground);
    })();
  </script>
</head>

  <!-- ============================================================
       ✅ RENDU PARTAGÉ (utilisable par cache et Supabase)
       ============================================================ -->
  <script>
    window.HADSHOP_DEFAULT_PRODUCTS = [
      { id: "sac-lady-gris", name: "Sac Lady Gris", category: "Sacs", price: 120000, promoPrice: null, images: ["https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&q=80"], image: null, stock: 10 },
      { id: "parfum-eclat", name: "Parfum Éclat", category: "Parfums", price: 85000, promoPrice: 65000, images: ["https://images.unsplash.com/photo-1541643600914-78b084683601?w=600&q=80"], image: null, stock: 15 },
      { id: "mini-sac-nude", name: "Mini Sac Nude", category: "Sacs", price: 95000, promoPrice: null, images: ["https://images.unsplash.com/photo-1591561954557-26941169b49e?w=600&q=80"], image: null, stock: 8 },
      { id: "parfum-noir", name: "Parfum Noir", category: "Parfums", price: 110000, promoPrice: null, images: ["https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=600&q=80"], image: null, stock: 5 },
      { id: "montre-acier", name: "Montre Acier", category: "Montres", price: 75000, promoPrice: null, images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80"], image: null, stock: 3 },
      { id: "bracelet-dore", name: "Bracelet Doré", category: "Bijoux", price: 25000, promoPrice: null, images: ["https://images.unsplash.com/photo-1608042314453-ae338d80c427?w=600&q=80"], image: null, stock: 20 },
      { id: "escarpins-nude", name: "Escarpins Nude", category: "Chaussures", price: 65000, promoPrice: null, images: ["https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=600&q=80"], image: null, stock: 12 },
      { id: "gourde-isotherme", name: "Gourde Isotherme", category: "Gourdes & thermos", price: 15000, promoPrice: null, images: ["https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=600&q=80"], image: null, stock: 50 }
    ];

    // ✅ Fonctions globales partagées
    window.HADSHOP_UTILS = {
      formatPrice: (n) => new Intl.NumberFormat("fr-FR").format(n).replace(/\u202f|\u00a0/g, " ") + " FCFA",
      getCart: () => { try { return JSON.parse(localStorage.getItem("hadshop-cart")) || []; } catch { return []; } },
      updateBadge: () => {
        const cart = window.HADSHOP_UTILS.getCart();
        const count = cart.reduce((s, l) => s + l.qty, 0);
        const badge = document.getElementById("cart-badge");
        if (badge) { badge.textContent = count; badge.hidden = count === 0; }
      },
      renderFilters: (container, categories, currentCat) => {
        let html = `<a href="boutique.html" class="eyebrow shrink-0 rounded-full border px-4 py-2.5 transition-colors ${currentCat === "" ? "border-primary bg-primary text-primary-foreground" : "border-border hover:border-primary hover:text-primary"}">Tout</a>`;
        categories.forEach(c => {
          const isActive = (currentCat === c);
          html += `<a href="boutique.html?categorie=${encodeURIComponent(c)}" class="eyebrow shrink-0 rounded-full border px-4 py-2.5 transition-colors ${isActive ? "border-primary bg-primary text-primary-foreground" : "border-border hover:border-primary hover:text-primary"}">${c}</a>`;
        });
        container.innerHTML = html;
      },
      // ✅ Hash des produits pour éviter les re-renders inutiles
      computeProductsHash: (products) => {
        return products.map(p => `${p.id}|${p.price}|${p.promoPrice || ''}|${p.stock || ''}|${p.name}|${p.category}`).join(',');
      },
      renderGrid: (container, emptyMsg, products, opts) => {
        const { currentCat, searchQuery, priceMin, priceMax, onlyPromo, sortBy } = opts;
        const formatPrice = window.HADSHOP_UTILS.formatPrice;
        const now = new Date();

        let filtered = products.filter(p => {
          const matchCat = (currentCat === "") || (p.category === currentCat);
          const searchLower = (searchQuery || "").toLowerCase().trim();
          const matchSearch = !searchLower || 
            p.name.toLowerCase().includes(searchLower) || 
            (p.description || "").toLowerCase().includes(searchLower);
          const inStock = (p.stock === undefined) || (Number(p.stock) > 0);
          const price = p.promoPrice || p.price;
          const matchPrice = price >= priceMin && price <= priceMax;
          const matchPromo = !onlyPromo || (p.promoPrice !== null && p.promoPrice !== undefined);
          return matchCat && matchSearch && inStock && matchPrice && matchPromo;
        });

        if (sortBy === "price-asc") {
          filtered.sort((a, b) => (a.promoPrice || a.price) - (b.promoPrice || b.price));
        } else if (sortBy === "price-desc") {
          filtered.sort((a, b) => (b.promoPrice || b.price) - (a.promoPrice || a.price));
        } else if (sortBy === "name-asc") {
          filtered.sort((a, b) => a.name.localeCompare(b.name, "fr"));
        } else {
          if (filtered[0] && filtered[0].createdAt) {
            filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          }
        }

        if (filtered.length === 0) {
          container.innerHTML = "";
          emptyMsg.classList.remove("hidden");
          return;
        }
        emptyMsg.classList.add("hidden");

        container.innerHTML = filtered.map(p => {
          const imgSrc = p.image || (p.images && p.images[0]) || "";
          let isNew = false;
          if (p.createdAt) {
            const diffDays = (now - new Date(p.createdAt)) / (1000 * 60 * 60 * 24);
            if (diffDays <= 7) isNew = true;
          }
          const finalPrice = p.promoPrice || p.price;
          const percent = p.promoPrice ? Math.round(((p.price - p.promoPrice) / p.price) * 100) : 0;
          const showStock = p.stock !== undefined && p.stock > 0 && p.stock <= 5;
          const stockLabel = showStock ? `<span class="absolute bottom-2 right-2 bg-white/90 text-[10px] font-medium px-2 py-1 rounded text-red-600 shadow-sm z-10">Plus que ${p.stock} en stock</span>` : "";

          return `
            <a href="produit.html?id=${p.id}" class="group block relative">
              <div class="relative aspect-[4/5] overflow-hidden bg-blush">
                ${imgSrc ? `<img src="${imgSrc}" alt="${p.name}" loading="lazy" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105" />` : `<div class="h-full w-full flex items-center justify-center text-xs text-muted-foreground">Sans image</div>`}
                ${isNew ? `<span class="eyebrow absolute left-2 top-2 bg-background/90 px-2 py-1 text-[0.6rem] text-primary">Nouveau</span>` : ""}
                ${p.promoPrice ? `<span class="absolute right-2 top-2 bg-red-600 text-white text-[10px] font-bold px-1.5 py-1 rounded-full shadow-sm z-10">-${percent}%</span>` : ""}
                ${stockLabel}
              </div>
              <div class="pt-3">
                <h3 class="font-display text-lg leading-tight text-primary">${p.name}</h3>
                <div class="mt-1 flex items-center gap-2">
                  <p class="text-sm text-primary font-medium">${formatPrice(finalPrice)}</p>
                  ${p.promoPrice ? `<p class="text-xs text-muted-foreground line-through">${formatPrice(p.price)}</p>` : ""}
                </div>
              </div>
            </a>
          `;
        }).join("");
      }
    };
  </script>

  <!-- ============================================================
       ✅ HYDRATATION INSTANTANÉE (header + filtres + grille)
       ============================================================ -->
  <script>
    (function hydrateFromCache() {
      const U = window.HADSHOP_UTILS;
      const D = window.HADSHOP_DEFAULTS;
      const S = window.HADSHOP_CACHED_SETTINGS || {};
      const C = window.HADSHOP_CACHED_PRODUCTS;

      // ---- Header / footer ----
      const shopName = S.shopName || D.SHOP_NAME;
      const heroText = S.heroText || D.HERO_TEXT;
      const whatsapp = S.whatsapp || D.WHATSAPP;
      const categories = (S.categories && S.categories.length) ? S.categories : D.CATEGORIES;

      const setText = (id, txt) => {
        const el = document.getElementById(id);
        if (el) { el.textContent = txt; el.style.visibility = "visible"; }
      };
      setText("header-logo", shopName);
      setText("mobile-logo", shopName);
      setText("footer-logo", shopName);
      setText("footer-slogan", heroText);

      const wa = document.getElementById("footer-wa-link");
      if (wa) { wa.href = `https://wa.me/${whatsapp}`; wa.style.visibility = "visible"; }

      U.updateBadge();

      // ---- Contexte filtres (URL) ----
      const params = new URLSearchParams(window.location.search);
      const currentCat = params.get("categorie") || "";
      const initialOpts = {
        currentCat,
        searchQuery: "",
        priceMin: 0,
        priceMax: Infinity,
        onlyPromo: false,
        sortBy: "recent"
      };

      // ---- Filtres catégories ----
      const filtersContainer = document.getElementById("filters-container");
      if (filtersContainer) {
        U.renderFilters(filtersContainer, categories, currentCat);
        filtersContainer.style.visibility = "visible";
      }

      // ---- Grille produits (cache ou fallback défaut) ----
      const gridContainer = document.getElementById("grid-container");
      const emptyMessage = document.getElementById("empty-message");
      if (gridContainer) {
        const products = (C && Array.isArray(C) && C.length > 0) ? C : window.HADSHOP_DEFAULT_PRODUCTS;
        U.renderGrid(gridContainer, emptyMessage, products, initialOpts);
        gridContainer.style.visibility = "visible";
        // ✅ On mémorise le hash de ce qui est affiché
        window.__displayedProductsHash = U.computeProductsHash(products);
      }
    })();
  </script>

  <!-- ============================================================
       ✅ SCRIPT PRINCIPAL — sync Supabase + interactions
       ============================================================ -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const U = window.HADSHOP_UTILS;
      const D = window.HADSHOP_DEFAULTS;

      let settings = null;
      let products = [];

      try {
        const { data: settingsData } = await window.supabaseClient
          .from("settings")
          .select("*")
          .eq("id", 1)
          .single();
        if (settingsData) settings = settingsData;
      } catch (e) {
        console.warn("Erreur chargement paramètres :", e);
      }

      try {
        const { data: productsData } = await window.supabaseClient
          .from("products")
          .select("*")
          .order("createdAt", { ascending: false });
        if (productsData) products = productsData;
      } catch (e) {
        console.warn("Erreur chargement produits :", e);
      }

      if (settings) {
        try { localStorage.setItem("hadshop_settings", JSON.stringify(settings)); } catch (e) {}
      }
      if (products && products.length > 0) {
        try { localStorage.setItem("hadshop_products_cache", JSON.stringify(products)); } catch (e) {}
      }

      const PRODUCTS = (products && products.length > 0) ? products : window.HADSHOP_DEFAULT_PRODUCTS;
      const CATEGORIES = (settings && settings.categories) ? settings.categories : D.CATEGORIES;
      const WHATSAPP_NUMBER = (settings && settings.whatsapp) ? settings.whatsapp : D.WHATSAPP;

      const SHOP_NAME = (settings && settings.shopName) ? settings.shopName : D.SHOP_NAME;
      const HERO_TEXT = (settings && settings.heroText) ? settings.heroText : D.HERO_TEXT;

      const updateText = (id, txt) => {
        const el = document.getElementById(id);
        if (el && el.textContent !== txt) { el.textContent = txt; el.style.visibility = "visible"; }
      };
      updateText("header-logo", SHOP_NAME);
      updateText("mobile-logo", SHOP_NAME);
      updateText("footer-logo", SHOP_NAME);
      updateText("footer-slogan", HERO_TEXT);

      const waLink = document.getElementById("footer-wa-link");
      if (waLink) {
        const newHref = `https://wa.me/${WHATSAPP_NUMBER}`;
        if (waLink.getAttribute("href") !== newHref) waLink.href = newHref;
        waLink.style.visibility = "visible";
      }

      U.updateBadge();

      const params = new URLSearchParams(window.location.search);
      const currentCat = params.get("categorie") || "";
      let searchQuery = "";
      let priceMin = 0;
      let priceMax = Infinity;
      let onlyPromo = false;
      let sortBy = "recent";

      const filtersContainer = document.getElementById("filters-container");
      const gridContainer = document.getElementById("grid-container");
      const emptyMessage = document.getElementById("empty-message");
      const searchInput = document.getElementById("search-input");
      const priceMinInput = document.getElementById("price-min");
      const priceMaxInput = document.getElementById("price-max");
      const promoCheckbox = document.getElementById("filter-promo");
      const sortSelect = document.getElementById("sort-select");
      const resetBtn = document.getElementById("reset-filters");

      function currentOpts() {
        return { currentCat, searchQuery, priceMin, priceMax, onlyPromo, sortBy };
      }

      // ---- Re-render uniquement si les données ont changé ----
      U.renderFilters(filtersContainer, CATEGORIES, currentCat);
      filtersContainer.style.visibility = "visible";

      const newHash = U.computeProductsHash(PRODUCTS);
      if (newHash !== window.__displayedProductsHash) {
        // ✅ Swap invisible : on cache, on remplace, on réaffiche à la frame suivante
        gridContainer.style.visibility = "hidden";
        U.renderGrid(gridContainer, emptyMessage, PRODUCTS, currentOpts());
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            gridContainer.style.visibility = "visible";
          });
        });
        window.__displayedProductsHash = newHash;
      } else {
        // ✅ Données identiques → pas de re-render → pas de flash
        console.log("[Boutique] Données identiques, pas de re-render.");
      }

      // ---- Écouteurs ----
      searchInput.addEventListener("input", (e) => { searchQuery = e.target.value; U.renderGrid(gridContainer, emptyMessage, PRODUCTS, currentOpts()); });
      priceMinInput.addEventListener("input", (e) => { priceMin = Number(e.target.value) || 0; U.renderGrid(gridContainer, emptyMessage, PRODUCTS, currentOpts()); });
      priceMaxInput.addEventListener("input", (e) => { priceMax = e.target.value ? Number(e.target.value) : Infinity; U.renderGrid(gridContainer, emptyMessage, PRODUCTS, currentOpts()); });
      promoCheckbox.addEventListener("change", (e) => { onlyPromo = e.target.checked; U.renderGrid(gridContainer, emptyMessage, PRODUCTS, currentOpts()); });
      sortSelect.addEventListener("change", (e) => { sortBy = e.target.value; U.renderGrid(gridContainer, emptyMessage, PRODUCTS, currentOpts()); });

      resetBtn.addEventListener("click", () => {
        priceMin = 0; priceMax = Infinity; onlyPromo = false; sortBy = "recent"; searchQuery = "";
        priceMinInput.value = ""; priceMaxInput.value = ""; promoCheckbox.checked = false;
        sortSelect.value = "recent"; searchInput.value = "";
        U.renderGrid(gridContainer, emptyMessage, PRODUCTS, currentOpts());
      });

      // ============================================================
      // ✅ TRIGGER ADMIN 3 CLICS (CORRIGÉ)
      // ============================================================
      const trigger = document.getElementById("secret-trigger");
      const toast = document.getElementById("admin-toast");
      let clickCount = 0;
      let debounceTimer = null;
      let redirectStarted = false;

      trigger.addEventListener("click", () => {
        // ✅ Si la redirection est déjà lancée, on ignore les clics supplémentaires
        if (redirectStarted) return;

        clickCount++;
        if (debounceTimer) clearTimeout(debounceTimer);

        if (clickCount === 3) {
          redirectStarted = true;
          trigger.style.pointerEvents = "none";

          toast.classList.remove("opacity-0", "translate-y-4");
          toast.classList.add("opacity-100", "translate-y-0");

          // ✅ Timer isolé, non annulable par erreur
          setTimeout(() => {
            window.location.assign("admin-login.html");
          }, 1500);
          clickCount = 0;
          return;
        }

        debounceTimer = setTimeout(() => { clickCount = 0; }, 1000);
      });
    });
  </script>
</body>
</html>
