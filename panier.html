  <!-- ✅ ÉTAPE 1 : Lecture du thème AVANT tout -->
  <script>
    window.HADSHOP_THEMES = {
      bordeaux: { primary: "#6b2a24", "primary-foreground": "#fcf6f5", secondary: "#f2dfd9", "muted-foreground": "#8a6a68", blush: "#f6e6e3", gold: "#c49a4a", background: "#fdfcfb", foreground: "#3b1c1a", border: "#ebd8d4" },
      noirOr: { primary: "#1a1a1a", "primary-foreground": "#d4af37", secondary: "#f0e6d2", "muted-foreground": "#6a6a6a", blush: "#f5efe0", gold: "#d4af37", background: "#faf6ec", foreground: "#1a1a1a", border: "#d4cbb5" },
      pastel: { primary: "#8b6b7d", "primary-foreground": "#fefefe", secondary: "#f5e6ee", "muted-foreground": "#a893a0", blush: "#fdf0f5", gold: "#d4a5c0", background: "#fffafc", foreground: "#4a3540", border: "#ead5de" },
      emeraude: { primary: "#1e4d3a", "primary-foreground": "#f0f9f4", secondary: "#d8e8df", "muted-foreground": "#4a6a5a", blush: "#e0f0e6", gold: "#b8933f", background: "#f8fbf9", foreground: "#1a3a2a", border: "#c8dcd0" }
    };

    let HADSHOP_THEME = "bordeaux";
    try {
      const raw = localStorage.getItem("hadshop_settings");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.theme && window.HADSHOP_THEMES[parsed.theme]) {
          HADSHOP_THEME = parsed.theme;
        }
      }
    } catch (e) {}
    
    window.HADSHOP_ACTIVE_COLORS = window.HADSHOP_THEMES[HADSHOP_THEME];
    console.log("[HADShop Panier] Thème actif :", HADSHOP_THEME);
  </script>

  <style id="theme-fallback">
    /* ✅ ARRIÈRE-PLAN EN 2 COUCHES : dégradé immédiat + image swap invisible */
    html, body {
      min-height: 100vh;
    }

    body {
      /* Couche 1 : dégradé boutique instantané (aucun téléchargement) */
      background-color: var(--theme-bg, #fdfcfb);
      background-image: linear-gradient(135deg, #f5ebe6 0%, #ebd8d0 40%, #e0c9be 70%, #d4bfb5 100%);
      background-size: 100% 100%;
      background-attachment: fixed;
      background-position: center;
      color: var(--theme-fg);
      position: relative;
      z-index: 0;
      transition: background-image 0.6s ease;
    }

    /* ✅ Quand l'image est chargée, on la superpose en douceur */
    body.bg-loaded {
      background-image: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
    }

    /* Voile semi-transparent + flou pour la lisibilité (effet WhatsApp) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: var(--theme-bg, #fdfcfb);
      opacity: 0.88;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: -1;
      pointer-events: none;
    }

    /* ✅ Anti-FOUC */
    [data-hydrate] { visibility: hidden; }

    /* ✅ EFFET VERRE DÉPOLI POUR LES BLOCS (Glassmorphism) */
    .glass-panel {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
    }

    /* Style champs de formulaire */
    .had-input {
      width: 100%;
      border: 1px solid var(--theme-border, #ebd8d4);
      background: rgba(255,255,255,0.8);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s, background .2s;
      border-radius: 0.25rem;
    }
    .had-input:focus { border-color: var(--theme-primary, #6b2a24); background: #fff; }
    .had-label { display:block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.5rem; opacity: 0.8; font-weight: 500; }
  </style>
  <script>
    (function() {
      const c = window.HADSHOP_ACTIVE_COLORS;
      document.documentElement.style.setProperty('--theme-bg', c.background);
      document.documentElement.style.setProperty('--theme-fg', c.foreground);
      document.documentElement.style.setProperty('--theme-primary', c.primary);
      document.documentElement.style.setProperty('--theme-border', c.border);
    })();

    // ✅ Charge l'image de fond en priorité et l'applique dès qu'elle est prête
    (function preloadBg() {
      const src = 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1600&auto=format&fit=crop';
      const img = new Image();
      img.onload = () => {
        // Force le navigateur à décoder l'image AVANT d'ajouter la classe
        if (img.decode) {
          img.decode().then(() => {
            document.body.classList.add('bg-loaded');
          }).catch(() => {
            document.body.classList.add('bg-loaded');
          });
        } else {
          document.body.classList.add('bg-loaded');
        }
      };
      img.src = src;

      // Si l'image est déjà en cache (2e visite), on l'applique tout de suite
      if (img.complete) {
        document.body.classList.add('bg-loaded');
      }
    })();
  </script>

  <!-- ============================================================
       ✅ HYDRATATION INSTANTANÉE (header + panier)
       ============================================================ -->
  <script>
    (function hydrateAllFromCache() {
      let S = {};
      try {
        const raw = localStorage.getItem("hadshop_settings");
        if (raw) S = JSON.parse(raw) || {};
      } catch (e) {}

      const shopName = S.shopName || "HADSHOP";
      const heroText = S.heroText || "Mode, sacs, parfums & accessoires.";
      const whatsapp = S.whatsapp || "2290191647720";

      const setText = (id, txt) => {
        const el = document.getElementById(id);
        if (el) { el.textContent = txt; el.style.visibility = "visible"; }
      };
      setText("header-logo", shopName);
      setText("mobile-logo", shopName);
      setText("footer-logo", shopName);
      setText("footer-slogan", heroText);

      const wa = document.getElementById("footer-wa-link");
      if (wa) { wa.href = `https://wa.me/${whatsapp}`; wa.style.visibility = "visible"; }

      // ---- Panier ----
      const STORAGE_KEY = "hadshop-cart";
      const formatPrice = (n) => new Intl.NumberFormat("fr-FR").format(n).replace(/\u202f|\u00a0/g, " ") + " FCFA";
      const cartTotal = (lines) => lines.reduce((s, l) => s + l.price * l.qty, 0);
      const getCart = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } };
      const saveCart = (lines) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(lines));
        updateBadge();
      };
      const updateBadge = () => {
        const count = getCart().reduce((s, l) => s + l.qty, 0);
        const badge = document.getElementById("cart-badge");
        if (badge) { badge.textContent = count; badge.hidden = count === 0; }
      };

      updateBadge();

      const app = document.getElementById("cart-app");
      if (!app) return;

      function drawCart() {
        const lines = getCart();

        if (lines.length === 0) {
          app.innerHTML = `
            <div class="px-6 py-24 text-center">
              <h1 class="text-5xl text-primary font-display">Votre panier</h1>
              <p class="mt-4 text-muted-foreground">Il est encore vide.</p>
              <a href="boutique.html" class="btn-primary mt-8 inline-flex">Découvrir la boutique</a>
            </div>
          `;
          return;
        }

        const total = cartTotal(lines);

        app.innerHTML = `
          <div class="mx-auto max-w-2xl px-4 pb-40 pt-10">
            <h1 class="text-center text-5xl text-primary font-display mb-8">Votre panier</h1>
            
            <div class="glass-panel rounded-2xl p-4 sm:p-6">
              <ul class="divide-y border-y border-border/50 divide-border/50">
                ${lines.map(l => `
                  <li class="grid grid-cols-[80px_minmax(0,1fr)_auto] gap-4 py-5">
                    <img src="${l.image}" alt="${l.name}" class="aspect-[4/5] w-20 object-cover bg-blush rounded-md" />
                    <div class="min-w-0">
                      <p class="font-display text-lg leading-tight text-gray-900">${l.name}</p>
                      ${l.variant ? `<p class="text-xs text-muted-foreground">${l.variant}</p>` : ""}
                      <p class="mt-1 text-sm font-medium text-gray-900">${formatPrice(l.price)}</p>
                      <div class="mt-3 inline-flex items-center border border-gray-300 rounded-md bg-white/50 overflow-hidden">
                        <button data-minus="${l.key}" class="p-2 hover:bg-gray-100 transition-colors"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14"/></svg></button>
                        <span class="w-8 text-center text-sm font-medium">${l.qty}</span>
                        <button data-plus="${l.key}" class="p-2 hover:bg-gray-100 transition-colors"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg></button>
                      </div>
                    </div>
                    <div class="flex flex-col items-end justify-between">
                      <button data-remove="${l.key}" class="hover:text-red-500 transition-colors"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-gray-400"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
                      <p class="text-sm text-primary font-bold">${formatPrice(l.price * l.qty)}</p>
                    </div>
                  </li>
                `).join("")}
              </ul>
            
              <div class="mt-6 flex justify-between text-sm text-gray-600"><span>Livraison</span><span>À confirmer</span></div>
              <div class="mt-2 flex justify-between font-display text-2xl"><span>Total estimé</span><span class="text-primary font-bold">${formatPrice(total)}</span></div>
            </div>

            <div class="fixed inset-x-0 bottom-0 z-30 border-t border-border bg-background p-4 md:static md:mt-8 md:border-0 md:p-0">
              <button id="order-btn" class="btn-primary w-full shadow-lg">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg> 
                Commander sur WhatsApp
              </button>
              <p class="mt-2 text-center text-[11px] text-muted-foreground">Appuyez sur « Envoyer » dans WhatsApp, puis attendez notre confirmation.</p>
            </div>
          </div>
        `;

        app.querySelectorAll("[data-plus]").forEach(btn => {
          btn.onclick = () => {
            const lines = getCart();
            const l = lines.find(x => x.key === btn.dataset.plus);
            if (l) { l.qty += 1; saveCart(lines); drawCart(); }
          };
        });
        app.querySelectorAll("[data-minus]").forEach(btn => {
          btn.onclick = () => {
            const lines = getCart();
            const l = lines.find(x => x.key === btn.dataset.minus);
            if (l) { l.qty = Math.max(1, l.qty - 1); saveCart(lines); drawCart(); }
          };
        });
        app.querySelectorAll("[data-remove]").forEach(btn => {
          btn.onclick = () => {
            const lines = getCart().filter(x => x.key !== btn.dataset.remove);
            saveCart(lines); drawCart();
          };
        });
        const orderBtn = document.getElementById("order-btn");
        if (orderBtn) orderBtn.onclick = () => {
          if (window.__renderConfirmation) window.__renderConfirmation();
        };
      }

      drawCart();
      window.__drawCartInstant = drawCart;
    })();
  </script>

                Commander sur WhatsApp
              </button>
              <p class="mt-2 text-center text-[11px] text-muted-foreground">Appuyez sur « Envoyer » dans WhatsApp, puis attendez notre confirmation.</p>
            </div>
          </div>
        `;

        app.querySelectorAll("[data-plus]").forEach(btn => {
          btn.onclick = () => {
            const lines = getCart();
            const l = lines.find(x => x.key === btn.dataset.plus);
            if (l) {
              const maxStock = stockMap[l.productId];
              if (maxStock !== undefined && l.qty >= maxStock) {
                alert(`Désolé, il ne reste que ${maxStock} article(s) en stock.`);
                return;
              }
              l.qty += 1;
              saveCart(lines);
              renderCart();
            }
          };
        });

        app.querySelectorAll("[data-minus]").forEach(btn => {
          btn.onclick = () => {
            const lines = getCart();
            const l = lines.find(x => x.key === btn.dataset.minus);
            if (l) { l.qty = Math.max(1, l.qty - 1); saveCart(lines); renderCart(); }
          };
        });

        app.querySelectorAll("[data-remove]").forEach(btn => {
          btn.onclick = () => {
            const lines = getCart().filter(x => x.key !== btn.dataset.remove);
            saveCart(lines); renderCart();
          };
        });

        document.getElementById("order-btn").onclick = () => {
          renderConfirmation();
        };
      }

      // ==========================================================
      // ✅ ÉCRAN DE CONFIRMATION
      // ==========================================================
      function renderConfirmation() {
        const lines = getCart();
        const total = cartTotal(lines);

        app.innerHTML = `
          <div class="mx-auto max-w-xl px-4 pb-32 pt-10">
            <button id="back-to-cart" class="eyebrow inline-flex items-center gap-1.5 text-muted-foreground hover:text-primary transition-colors mb-6">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Retour au panier
            </button>

            <h1 class="text-4xl text-primary font-display mb-2">Finaliser la commande</h1>
            <p class="text-sm text-muted-foreground mb-8">Renseignez vos informations, puis validez pour envoyer la commande sur WhatsApp.</p>

            <div class="glass-panel rounded-2xl p-6 space-y-6">
              <div>
                <label for="client-name" class="had-label">Votre nom <span class="text-destructive">*</span></label>
                <input id="client-name" type="text" class="had-input" placeholder="Ex : Aïcha D." autocomplete="name" required />
                <p id="name-error" class="mt-1 text-xs text-destructive hidden">Merci d'indiquer votre nom.</p>
              </div>

              <div>
                <p class="had-label">Souhaitez-vous une livraison ?</p>
                <div class="grid grid-cols-2 gap-3 mt-2">
                  <button type="button" data-delivery="yes" class="delivery-choice border border-gray-300 bg-white/50 rounded-lg px-4 py-3 text-sm hover:border-primary transition-colors text-gray-700">
                    Oui, avec livraison
                  </button>
                  <button type="button" data-delivery="no" class="delivery-choice border border-gray-300 bg-white/50 rounded-lg px-4 py-3 text-sm hover:border-primary transition-colors text-gray-700">
                    Non, je viens retirer
                  </button>
                </div>
              </div>

              <div id="delivery-zone-wrap" class="hidden">
                <label for="delivery-zone" class="had-label">Lieu de livraison <span class="text-destructive">*</span></label>
                <input id="delivery-zone" type="text" class="had-input" placeholder="Ex : Cotonou, Quartier Fidjrossè" />
                <p id="zone-error" class="mt-1 text-xs text-destructive hidden">Merci d'indiquer le lieu de livraison.</p>
              </div>
            </div>

            <div class="mt-8 border-t border-border/50 pt-4">
              <div class="flex justify-between text-sm text-gray-600"><span>Total estimé</span><span>${formatPrice(total)}</span></div>
              <div id="delivery-summary-line" class="flex justify-between text-sm text-gray-600 mt-1 hidden"><span>Livraison</span><span>À confirmer</span></div>
            </div>

            <div class="fixed inset-x-0 bottom-0 z-30 border-t border-border bg-background p-4 md:static md:mt-8 md:border-0 md:p-0">
              <button id="validate-order-btn" class="btn-primary w-full shadow-lg">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 6 9 17l-5-5"/></svg>
                Valider la commande
              </button>
              <p class="mt-2 text-center text-[11px] text-muted-foreground">Vous serez redirigé vers WhatsApp pour finaliser.</p>
            </div>
          </div>
        `;

        document.getElementById("back-to-cart").onclick = () => renderCart();

        let wantsDelivery = null;
        const zoneWrap = document.getElementById("delivery-zone-wrap");
        const deliverySummary = document.getElementById("delivery-summary-line");
        const choiceBtns = app.querySelectorAll(".delivery-choice");

        choiceBtns.forEach(btn => {
          btn.addEventListener("click", () => {
            choiceBtns.forEach(b => b.classList.remove("bg-primary", "text-primary-foreground", "border-primary", "text-white"));
            choiceBtns.forEach(b => b.classList.add("bg-white/50", "text-gray-700"));
            
            btn.classList.remove("bg-white/50", "text-gray-700");
            btn.classList.add("bg-primary", "text-primary-foreground", "border-primary", "text-white");

            if (btn.dataset.delivery === "yes") {
              wantsDelivery = true;
              zoneWrap.classList.remove("hidden");
              deliverySummary.classList.remove("hidden");
            } else {
              wantsDelivery = false;
              zoneWrap.classList.add("hidden");
              deliverySummary.classList.add("hidden");
            }
          });
        });

        document.getElementById("validate-order-btn").onclick = async () => {
          const nameInput = document.getElementById("client-name");
          const zoneInput = document.getElementById("delivery-zone");
          const nameErr = document.getElementById("name-error");
          const zoneErr = document.getElementById("zone-error");

          const name = nameInput.value.trim();
          const zone = zoneInput ? zoneInput.value.trim() : "";

          let valid = true;
          if (!name) { nameErr.classList.remove("hidden"); nameInput.focus(); valid = false; }
          else { nameErr.classList.add("hidden"); }

          if (wantsDelivery === null) {
            alert("Merci d'indiquer si vous souhaitez une livraison ou non.");
            valid = false;
          }

          if (wantsDelivery === true && !zone) {
            zoneErr.classList.remove("hidden");
            if (valid) zoneInput.focus();
            valid = false;
          } else {
            zoneErr.classList.add("hidden");
          }

          if (!valid) return;

          const btn = document.getElementById("validate-order-btn");
          btn.disabled = true;
          btn.style.opacity = "0.7";
          btn.textContent = "Enregistrement...";

          const ref = "HAD-" + Math.floor(Math.random() * 90000 + 10000);

          try {
            const orderData = {
              id: ref,
              date: new Date().toISOString(),
              client: name,
              phone: null,
              zone: wantsDelivery ? zone : null,
              total: total,
              status: "Nouvelle demande",
              stockDeducted: false,
              items: lines.map(l => ({
                productId: l.productId,
                name: l.name,
                qty: l.qty,
                price: l.price
              }))
            };
            
            const { error } = await window.supabaseClient.from("orders").insert([orderData]);
            if (error) {
              console.error("Erreur enregistrement commande :", error);
              alert("Attention : la commande n'a pas pu être enregistrée. Elle sera envoyée sur WhatsApp mais pas enregistrée dans le backoffice.");
            }
          } catch (e) {
            console.error("Exception :", e);
          }

          const deliveryLine = wantsDelivery
            ? `Livraison : Oui\nLieu de livraison : ${zone}`
            : `Livraison : Non (retrait en boutique)`;

          const msg = `Bonjour ${SHOP_NAME}, je souhaite commander :\n\nRéf. ${ref}\n\n${lines.map(l => `• ${l.name}${l.variant ? ` (${l.variant})` : ""}\n  ${l.qty} x ${formatPrice(l.price)} = ${formatPrice(l.price * l.qty)}`).join("\n")}\n\nTotal estimé : ${formatPrice(total)}\n${deliveryLine}\n\nNom du client : ${name}`;
          
          saveCart([]);
          window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
        };
      }

      renderCart();
      window.__renderConfirmation = renderConfirmation;

      // ============================================================
      // ✅ TRIGGER ADMIN 3 CLICS (CORRIGÉ)
      // ============================================================
      const trigger = document.getElementById("secret-trigger");
      const toast = document.getElementById("admin-toast");
      let clickCount = 0;
      let debounceTimer = null;
      let redirectStarted = false;

      trigger.addEventListener("click", () => {
        if (redirectStarted) return;

        clickCount++;
        if (debounceTimer) clearTimeout(debounceTimer);

        if (clickCount === 3) {
          redirectStarted = true;
          trigger.style.pointerEvents = "none";

          toast.classList.remove("opacity-0", "translate-y-4");
          toast.classList.add("opacity-100", "translate-y-0");

          setTimeout(() => {
            window.location.assign("admin-login.html");
          }, 1500);
          clickCount = 0;
          return;
        }

        debounceTimer = setTimeout(() => { clickCount = 0; }, 1000);
      });
    });
  </script>
</body>
</html>
